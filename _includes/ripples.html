{%- comment -%}
  0 → 1 ripple. Circles all touch at the left edge (cx = r) and each is 1.17× the one before, so
  growing the group by 1.17× about that point turns every circle into the next: a seamless outward
  ripple. Speed lives in the .ripples .wave animation in style.scss.
{%- endcomment -%}
