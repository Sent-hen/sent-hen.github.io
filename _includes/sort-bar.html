{%- comment -%}
  Alphabetical / Year sort for a simple list. Each <li> needs data-index, data-title, and data-year;
  an <li> with data-pinned="1", "2", ... stays on top in that order whatever the sort.
  Usage: {% include sort-bar.html target="stuff-list" %} placed above <ul id="stuff-list">.
{%- endcomment -%}
<div class="sort-bar small" id="{{ include.target }}-sort" hidden>
  <label for="{{ include.target }}-by" class="muted">Sort by</label>
  <select id="{{ include.target }}-by">
    <option value="title">Alphabetical</option>
    <option value="year">Year</option>
  </select>
  <button type="button" id="{{ include.target }}-dir" class="sort-dir" aria-label="Reverse order" title="Reverse order">&darr;</button>
</div>
<script>
  (function () {
    var id = '{{ include.target }}';
    var bar = document.getElementById(id + '-sort'), by = document.getElementById(id + '-by');
    var dir = document.getElementById(id + '-dir'), desc = false;
    bar.hidden = false;
    function apply() {
      var list = document.getElementById(id);
      var items = Array.prototype.slice.call(list.children);
      var key = by.value, sign = (key === 'year' ? -1 : 1) * (desc ? -1 : 1);   // A-Z, or newest first
      items.sort(function (a, b) {
        var pa = Number(a.dataset.pinned) || 0, pb = Number(b.dataset.pinned) || 0;
        if (pa || pb) return !pa ? 1 : !pb ? -1 : pa - pb;
        var x = a.dataset[key], y = b.dataset[key];
        if (!x && !y) return a.dataset.index - b.dataset.index;
        if (!x) return 1;
        if (!y) return -1;
        var d = key === 'year' ? Number(x) - Number(y) : x.localeCompare(y, undefined, { sensitivity: 'base' });
        return d !== 0 ? d * sign : a.dataset.index - b.dataset.index;
      }).forEach(function (li) { list.appendChild(li); });
    }
    by.addEventListener('change', function () { desc = false; dir.innerHTML = '&darr;'; apply(); });
    dir.addEventListener('click', function () { desc = !desc; dir.innerHTML = desc ? '&uarr;' : '&darr;'; apply(); });
    document.addEventListener('DOMContentLoaded', apply);
  })();
</script>
