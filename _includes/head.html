<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != "Home" %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="theme-color" content="#2C4434" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#261312" media="(prefers-color-scheme: dark)">

  <script>
    // Each visit opens green (light) or red (dark) by chance, and the chance follows a plate of tiramisu.
    // A fresh plate is made at midnight (the visitor's local time) and goes off by exponential decay with a
    // half-life of 12 hours, so the chance it is still fresh is 2^(-hours since midnight / 12): 100% at
    // midnight, 50% at noon, 25% just before the next plate. Fresh means green (▲), gone off means red (▼).
    // The pick holds for the rest of the visit (sessionStorage); the toggle in the nav switches it.
    (function () {
      var HALF_LIFE_HOURS = 12;
      var t;
      try { t = sessionStorage.getItem('theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') {
        var now = new Date();
        var hours = now.getHours() + now.getMinutes() / 60 + now.getSeconds() / 3600;
        var fresh = Math.pow(2, -hours / HALF_LIFE_HOURS);
        t = Math.random() < fresh ? 'light' : 'dark';
        try { sessionStorage.setItem('theme', t); } catch (e) {}
      }
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>

  <link rel="icon" type="image/jpeg" href="{{ '/assets/img/icon.jpg' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/img/icon.jpg' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
