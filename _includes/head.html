<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != "Home" %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="theme-color" content="#2C4434">

  <script>
    // Green (light) by default for everyone; the switch in the nav changes to red (dark), and the choice is
    // remembered. The key is new, so choices saved by older versions of the site don't carry over.
    (function () {
      var t;
      try { t = localStorage.getItem('theme-choice'); } catch (e) {}
      document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
    })();
    // On a low-end device, or with reduced motion asked for, the drawings stay still (the network does not matter):
    // the tiramisu shows as its plain drawing and the spiral, triangle, ripple, and bars don't move.
    (function () {
      var weak = (navigator.deviceMemory && navigator.deviceMemory <= 2) ||
                 (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 2);
      var calm = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (weak || calm) document.documentElement.classList.add('still');
    })();
  </script>

  <link rel="icon" type="image/jpeg" href="{{ '/assets/img/icon.jpg' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/img/icon.jpg' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
