<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != "Home" %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="theme-color" content="#FFFCF0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#100F0F" media="(prefers-color-scheme: dark)">

  <script>
    // Dark by default. The toggle in the nav switches to light (or back), and the choice is remembered.
    (function () {
      var t;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
    })();
  </script>

  <link rel="icon" type="image/jpeg" href="{{ '/assets/img/icon.jpg' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/img/icon.jpg' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
