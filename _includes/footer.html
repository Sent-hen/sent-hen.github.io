<script>
  (function () {
    var root = document.documentElement;
    var btn = document.getElementById('theme-toggle');
    function isDark() { return root.getAttribute('data-theme') === 'dark'; }
    function sync() { btn.setAttribute('aria-checked', isDark() ? 'true' : 'false'); }
    btn.addEventListener('click', function () {
      var next = isDark() ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      // red is still; green moves, unless a reduced-motion setting asks for still
      var calm = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
      root.classList.toggle('still', next === 'dark' || calm);
      try { localStorage.setItem('theme-choice', next); } catch (e) {}
      sync();
    });
    sync();
  })();
</script>
