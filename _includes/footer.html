<script>
  (function () {
    var root = document.documentElement;
    var btn = document.getElementById('theme-toggle');
    function isDark() { return root.getAttribute('data-theme') === 'dark'; }
    function sync() { btn.setAttribute('aria-checked', isDark() ? 'true' : 'false'); }
    btn.addEventListener('click', function () {
      var next = isDark() ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('theme-choice', next); } catch (e) {}
      sync();
    });
    sync();
  })();
  (function () {
    // Hi / Lo: adds or removes the `still` class on the page and remembers the choice.
    var root = document.documentElement, btn = document.getElementById('motion-toggle');
    function sync() { btn.setAttribute('aria-checked', root.classList.contains('still') ? 'false' : 'true'); }
    btn.addEventListener('click', function () {
      var lo = root.classList.toggle('still');
      try { localStorage.setItem('motion-choice', lo ? 'lo' : 'hi'); } catch (e) {}
      sync();
    });
    sync();
  })();
</script>
