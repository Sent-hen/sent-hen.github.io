---
layout: default
---
<article class="note">
  <h1>{{ page.title }}</h1>
  <div class="meta muted small"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%B %-d, %Y' }}</time></div>
  {{ content }}
  <p class="back-link small"><a href="{{ '/notes/' | relative_url }}" class="muted">&larr; All notes</a></p>
</article>
