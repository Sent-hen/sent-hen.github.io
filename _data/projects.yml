  tags: [JavaScript, Python, XML, SVG]
  repo: https://github.com/Sent-hen/DEXPI-PID-Viewer
  bullets:
    - "DEXPI is the open exchange format for P&IDs, so a valid file should be all you need to see and check a plant model"
    - "A DEXPI file can describe a whole plant with no drawing coordinates, and checking one usually means heavy tools or uploading it somewhere"
    - "Built a zero-dependency, single-page viewer that lays diagrams out from topology alone (layered flow and stress-majorization layouts, picked per connected group) and validates structure and the Core and Plant 2.0.1 metamodel in the browser, plus a Python command-line validator with XSD checks for pipelines"
    - "Next, checking every drawing the P&ID Digitizer produces as it comes out, so a scan can be digitized, viewed, and validated end to end"

