- slug: word2eq
  title: Word2Eq
  start: "2024-04"
  status: active
  domains: [AI/ML, Backend/infra]
  summary: A reproducible training pipeline and SLO-instrumented inference service that turns math word problems into verified equations
  tags: [Python, PyTorch, FastAPI, Docker, Prometheus, Kubernetes, GitHub Actions]
  repo: https://github.com/Sent-hen/Word2Eq
  bullets:
    - "A small model should be able to turn a math word problem into an equation you can trust, and be trained and served like a real system"
    - "My 2024 prototype never worked, and a model that writes malformed equations or can't be retrained the same way twice isn't trustworthy"
    - "Rebuilt it as a train, evaluate, and serve platform for a 6.4M-parameter Transformer: grammar-masked decoding took valid equations from 97.4% to 100% on 1,000 SVAMP problems, resumed training is bit-identical, and the service handles 150 requests per second at 73 ms p95 on one laptop CPU"
    - "Next, running it against its availability, latency, and answer-integrity SLOs on the Kubernetes setup, with the CI promotion gate deciding every release"

- slug: metal-to-pod
  title: "Metal-to-Pod: self-hosted CI/CD"
  start: "2026-09"
  status: active
  domains: [Backend/infra]
  summary: A commit-to-pod delivery path from VMware VMs to Kubernetes with no cloud services, run with SLOs, rollback, and failure drills
  tags: [Kubernetes, Bash, Go, Docker, Jenkins, Prometheus, Vagrant]
  repo: https://github.com/Sent-hen/metal-to-pod
  bullets:
    - "Every commit should reach a running pod on its own, safely, without renting a cloud to do it"
    - "Without managed services, everything a cloud hides (cluster networking, a registry and its certificates, build triggers, rollback) has to be built and kept running by hand, on a 16 GB laptop"
    - "Built it across 4 VMware VMs from one env file: a kubeadm cluster with default-deny network policy, a git hook into Jenkins as code, a private TLS registry, ~10 MB distroless images tagged by commit, and a smoke test that rolls back bad releases"
    - "Next, running the Go delivery-promise service against its 99.5% availability and 300 ms SLOs, with 8 failure drills, 5 runbooks, and burn-rate alerts already in place"

