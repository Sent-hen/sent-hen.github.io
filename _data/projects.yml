    - "An event study by rarity and wear: a 19% drawdown with the trough at 25 hours, Covert inputs up 43.5% in 48 hours (t = 8.95), Battle-Scarred Coverts up 258% at 14 days, and the new contract modeled as a call option, all from a tested Python CLI"
