# Projects shown on the /projects/ timeline: active ones first, then the rest, each newest first (by start).
#
# slug      anchor id on /projects/
# start     "YYYY-MM" the project began; shown as YYYY MM and used for the order; an active project gets a trailing dash
# status    active (In progress) or done (Done)
# domains   Backend/infra | Security | AI/ML | other short labels
# tags      tech, ordered by how heavily the project uses it (most first)
# repo      public repository URL; leave empty for private repos
# site      live site URL, shown as a "Site" link; leave it out if there is none
# cv_title  the project's name on /resume/ and /cv/ and in the PDFs
# cv        bullets, word for word the same as the PDFs (Resume repository): what was achieved, how it was
#           measured, how it was done. All are on /cv/; those with resume: true are also on /resume/.
#           Order, where the project used them: AI/ML, then Backend/Infra, then Cybersecurity
# bullets   four, shown under "Note", following a pattern without labelling it:
#           the idea (thesis), what stood against it (antithesis), what I built (synthesis), what's next

