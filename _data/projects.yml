- slug: word2eq
  title: Word2Eq
  start: "2024-04"
  status: done
  domains: [AI/ML, Backend/infra]
  summary: A reproducible training pipeline and SLO-instrumented inference service that turns math word problems into verified equations
  tags: [Python, PyTorch, FastAPI, Docker, Prometheus, Kubernetes, GitHub Actions]
  cv_title: "Word2Eq: Seq2Seq Training & Serving"
  cv:
    - text: "Took valid equations from 97.4% to 100% on 1,000 SVAMP problems by rebuilding a non-functional prototype into a train, evaluate, and serve platform for a 6.4M-parameter Transformer with grammar-constrained decoding"
      resume: true
    - text: "Eliminated malformed outputs by masking logits with a pushdown-automaton grammar during decoding, then checking every answer symbolically before returning it"
    - text: "Made every model traceable to its inputs with versioned artifacts whose model cards record a config fingerprint, SHA-256 data hashes, and the git revision"
    - text: "Made resumed training bit-identical by checkpointing optimizer, scheduler, RNG, and in-epoch position atomically on SIGTERM, verified by 32 pytest cases in CI"
    - text: "Served 150 requests/s at 73 ms p95 on one laptop CPU by micro-batching behind a bounded queue that sheds overload with a fast 503, and made training preemption-safe with bit-identical resumes"
      resume: true
    - text: "Guarded releases with a CI promotion gate on accuracy and validity, and ran the service against availability, latency, and answer-integrity SLOs with burn-rate alerts, a runbook, and a Kubernetes manifest with probes, a PDB, and an HPA"
  repo: https://github.com/Sent-hen/Word2Eq
  bullets:
    - "A small model should be able to turn a math word problem into an equation you can trust, and be trained and served like a real system"
    - "My 2024 prototype never worked, and a model that writes malformed equations or can't be retrained the same way twice isn't trustworthy"
    - "Rebuilt it as a train, evaluate, and serve platform for a 6.4M-parameter Transformer: grammar-masked decoding took valid equations from 97.4% to 100% on 1,000 SVAMP problems, resumed training is bit-identical, and the service handles 150 requests per second at 73 ms p95 on one laptop CPU"
    - "Next, running it against its availability, latency, and answer-integrity SLOs on the Kubernetes setup, with the CI promotion gate deciding every release"

