- slug: pid-digitizer
  title: P&ID Digitizer
  start: "2026-10"
  status: active
  domains: [AI/ML, Backend/infra]
  summary: Turns scanned engineering drawings (P&IDs) into machine-readable graphs, with a review UI for correcting low-confidence output
  tags: [Python, PyTorch, OpenCV, FastAPI, Docker, NetworkX, SQLite]
  cv_title: "P&ID Digitizer: Scanned Drawings to Graphs"
  cv:
    - text: "Turned scanned P&IDs into queryable graphs (GraphML, DEXPI 2.0.1 XML) at 0.915 edge F1 and 0.997 symbol mAP@0.5 on a 75-sheet test split by chaining symbol detection, line extraction, and graph assembly"
      resume: true
    - text: "Found small symbols on 7,000 px sheets by fine-tuning a Faster R-CNN on overlapping 1024² tiles, merged across seams"
      resume: true
    - text: "Kept training cheap, under 2 GPU-hours on a laptop RTX 4070, by fine-tuning a torchvision detector on tiles with 256 px overlap"
    - text: "Traced 80% of the remaining misses to nodes 2–4 px off rather than topology errors through error analysis, and reported the real-drawing gap openly (0.49 edge F1 on 8 real sheets)"
    - text: "Kept the evaluation honest by running each test split exactly once and recording 26 design decisions as they were made"
    - text: "Sent only doubtful edges to a person by calibrating per-edge confidence for a review UI, shipped as a FastAPI job service in a non-root Docker image with strict mypy and 99 pytest cases in CI"
      resume: true
    - text: "Made the service reliable to run with SQLite job state and timeouts, in a CPU image that runs end to end with <code>make demo</code>"
    - text: "Limited what a bad upload or model file can do with upload size and type limits and a SHA-1-checked model"
  repo: https://github.com/Sent-hen/PID-Digitizer
  bullets:
    - "Engineering drawings (P&IDs) hold a plant's process logic, but as scanned images no software can query them; as a graph (GraphML or DEXPI 2.0.1 XML) they can be"
    - "Symbols are tiny on 7,000 px sheets, lines cross and break, and a model that is confidently wrong is worse than no model, so accuracy alone does not make the output usable"
    - "Chained a tiled Faster R-CNN symbol detector, orthogonal line extraction, and graph assembly (0.915 edge F1 and 0.997 symbol mAP@0.5 on a 75-sheet test split), calibrated each edge's confidence, and built a review UI that surfaces only the doubtful edges, shipped as a FastAPI service in a Docker image"
    - "Real drawings still score lower (0.49 edge F1 on 8 sheets), and 80% of the remaining misses are nodes 2 to 4 px off rather than wrong connections, so closing that gap starts with node placement"

- slug: dexpi-viewer
  title: DEXPI P&ID Viewer
  start: "2026-10"
  status: done
  domains: [Tooling]
  summary: A dependency-free browser viewer and validator for DEXPI 2.0.1 plant-model XML
  tags: [JavaScript, Python, XML, SVG]
  cv_title: "DEXPI P&ID Viewer"
  cv:
    - text: "Let anyone open a DEXPI 2.0.1 plant model with nothing installed or uploaded by building a zero-dependency, single-page viewer that lays out diagrams from topology alone, with no stored coordinates"
      resume: true
    - text: "Drew diagrams with no stored coordinates by building a Sugiyama-style layered flow layout, a stress-majorization network layout, and an auto mode that switches per connected group"
    - text: "Caught invalid files before downstream tools do by validating structure and the metamodel in the browser and a CLI"
      resume: true
    - text: "Checked models against the Core and Plant 2.0.1 specs (class existence, property kinds, target types, multiplicity bounds) by generating a compact class table from the spec XML with a Python build script"
    - text: "Gave data pipelines a headless path with a Python CLI validator (lxml) that runs both XSD and metamodel checks"
    - text: "Made large models navigable with equipment, valve, and instrument symbols, a reference inspector, a model tree, ID and tag search, and SVG export"
  repo: https://github.com/Sent-hen/DEXPI-PID-Viewer
  bullets:
    - "DEXPI is the open exchange format for P&IDs, so a valid file should be all you need to see and check a plant model"
    - "A DEXPI file can describe a whole plant with no drawing coordinates, and checking one usually means heavy tools or uploading it somewhere"
    - "Built a zero-dependency, single-page viewer that lays diagrams out from topology alone (layered flow and stress-majorization layouts, picked per connected group) and validates structure and the Core and Plant 2.0.1 metamodel in the browser, plus a Python command-line validator with XSD checks for pipelines"
    - "Next, checking every drawing the P&ID Digitizer produces as it comes out, so a scan can be digitized, viewed, and validated end to end"

