- slug: cs2-tradeup-analysis
  title: The $2 billion patch note
  start: "2026-09"
  status: active
  domains: [Data analysis]
  summary: A financial event study of how one game update repriced a multi-billion-dollar virtual item market overnight
  tags: [Python, pandas, NumPy, SciPy, Matplotlib, pytest]
  repo: ""
  bullets:
    - "Counter-Strike 2's October 2025 trade-up update erased an estimated $2 billion of skin value in 48 hours, a real market shock worth measuring"
    - "A game market isn't a stock market: prices are daily Steam medians across about 3,900 items, and the update helped some items while it hurt others"
    - "An event study by rarity and wear: a 19% drawdown with the trough at 25 hours, Covert inputs up 43.5% in 48 hours (t = 8.95), Battle-Scarred Coverts up 258% at 14 days, and the new contract modeled as a call option, all from a tested Python CLI"
    - "Next, knife and glove prices, to test whether arbitrage closed the gap to each Covert's trade-up floor"

