# Stuff (/stuff/). Every category is rows of pairs: 1 / 2, then 3 / 4, and so on, in the order written here. Order and pairings are deliberate.
# art:    the poster or cover, in assets/img/stuff/
# also:   more posters this one fades through in turn; each can have its own title, creator, and year
# square: true for a category with square covers (the rest are 2:3 posters)
# creator: the lead: director, artist, author, or band. Hover shows title · creator · year under the poster.

