# Things I think are masterfully crafted, good or bad.
#
# Each category becomes a page at /interests/<key>/. Items are a flat list:
# no numbering, no grouping. Visitors can sort by any of the metadata fields.
#
# Item fields
#   title    what it is called
#   creator  artist, director, author, or maker
#   year     year of release or introduction (leave empty if unknown)
#   form     song, film, novel, watch, pen, ...
#   source   where it comes from: album, studio, publisher, model number
#   rating   integer 1-7 (TODO until rated)
#   note     one or two sentences on why it is here (TODO until written)
#   rotation products only: in or out (whether it's in use right now)

