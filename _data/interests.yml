# Interest categories, in the order they appear on /interests/.
# The items themselves live in _interests/<key>/<slug>.md (one file each).
#
# Item front matter
#   title       what it is called
#   creator     artist, director, author, or maker
#   year        year of release or introduction (leave empty if unknown)
#   year_label  optional word printed before the year: born, founded
#   form        song, film, novel, watch, pen, ...
#   source      where it comes from: album, studio, publisher, model line
#   score       -1 negative, 0 neutral, 1 positive (TODO until scored)
#   rotation    in = shown on /interests/ as current rotation (keep to 3 per category)
#   order       position in the default "Added" order on the category page
# The file body is the note shown on the item's own page.

order: [products, books, cinema, music, people, excerpts]

scores:
  - value: -1
    label: negative emotion
  - value: 0
    label: neutral
  - value: 1
    label: positive

categories:
  products: { title: Products, creator_label: Maker }
  books:    { title: Books,    creator_label: Author }
  cinema:   { title: Cinema,   creator_label: Director }
  music:    { title: Music,    creator_label: Artist }
  people:   { title: People,   creator_label: Known for }
  excerpts: { title: Excerpts, creator_label: Author }
