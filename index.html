<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>
  <style>
    :root {
      --bg: #121212;
      --text: #e0e0e0;
      --accent: #4a90e2;
      --card-bg: #1e1e1e;
      --border: #333;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 1rem;
      margin: 0;
    }
    h1 {
      text-align: center;
      color: var(--accent);
    }
    .table-wrapper {
      overflow-x: auto;
    }
    table {
      width: 100%;
      min-width: max-content;
      border-collapse: collapse;
      margin-top: 2rem;
    }
    th, td {
      border: 1px solid var(--border);
      padding: 0.5rem;
      text-align: center;
      white-space: nowrap;
    }
    th {
      background-color: var(--card-bg);
    }
    button {
      background-color: var(--accent);
      color: white;
      border: none;
      border-radius: 4px;
      padding: 0.3rem 0.6rem;
      cursor: pointer;
    }
    .exercise-name {
      cursor: pointer;
      text-align: left;
      white-space: nowrap;
    }
    .group-level-1 { font-weight: bold; padding-left: 0.5rem; }
    .group-level-2 { font-style: italic; padding-left: 1.5rem; }
    .group-level-3 { padding-left: 3rem; }
    #chartModal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
    }
    #chartBox {
      background: var(--card-bg);
      padding: 1rem;
      border-radius: 8px;
      width: 90%;
      max-width: 600px;
    }
    @media (max-width: 768px) {
      .group-level-3 input {
        width: 4rem;
      }
      th, td {
        font-size: 0.75rem;
        white-space: nowrap;
        text-align: center;
        padding: 0.4rem;
      }
      .exercise-name {
        min-width: 150px;
        display: inline-block;
      }
      td input {
        width: 3.5rem;
      }
    }
  </style>
</head>
<body>
  <script>
    if (prompt("Enter access code:") !== "8008") {
      document.body.innerHTML = "<h1 style='color:red;text-align:center'>Access Denied</h1>";
      throw new Error("Access Denied");
    }

    const firebaseConfig = {
      apiKey: "AIzaSyCLxAt4SkpTVsL1sWa3Ed-Z6e7XpMznMmA",
      authDomain: "tracker-d4c4b.firebaseapp.com",
      projectId: "tracker-d4c4b",
      storageBucket: "tracker-d4c4b.firebasestorage.app",
      messagingSenderId: "907184545564",
      appId: "1:907184545564:web:5bf3998dfe986aa1a264d9"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const userId = "log_user_8008";
    let weeks = 1;
    let logs = {};

    async function loadLogs() {
      try {
        const doc = await db.collection("logs").doc(userId).get();
        if (doc.exists) {
          logs = doc.data();
          console.log("Loaded logs:", logs);
        } else {
          console.log("No logs found. Creating blank table.");
        }
      } catch (error) {
        console.error("Error connecting to Firestore:", error);
        alert("Firestore failed. Table will still load blank.");
      }
      createTable();
    }

    function saveLogs() {
      db.collection("logs").doc(userId).set(logs);
    }

    const structure = {
      Push: {
        Chest: ["Dips (Optional)", "Bench Press", "Incline Press"],
        Shoulder: ["Overhead Press (Machine)", "Lateral Raises (Cable)"],
        Triceps: ["Overhead Cable Triceps Extension (Bar)", "Skull Crushers"]
      },
      Pull: {
        Back: ["Deadlift", "Neutral Grip Lat Pulldowns", "Chest Supported Row", "Cable Row"],
        Biceps: ["Preacher Dumbbell Curl", "Preacher Hammer Curl"]
      },
      Legs: {
        Quads: ["Barbell Back Squat", "Bulgarian Split Squat"],
        Hamstrings: ["Romanian Deadlifts"],
        Glutes: ["Walking Lunges", "Hip Abduction"],
        Calves: ["Standing Calf Raise"]
      }
    };

    function createTable() {
      const container = document.getElementById('tableContainer');
      if (!container) return;

      container.innerHTML = '';
      const wrapper = document.createElement('div');
      wrapper.className = 'table-wrapper';

      const table = document.createElement('table');
      let headerRow = '<tr><th>Exercise</th>';
      for (let w = 1; w <= weeks; w++) {
        headerRow += `<th colspan="6">Week ${w}</th>`;
      }
      headerRow += '<th><button onclick="addWeek()">+</button></th></tr>';
      headerRow += '<tr><th></th>' + '<th>Sets</th><th>Reps</th><th>Weight</th><th>Sets</th><th>Reps</th><th>Weight</th>'.repeat(weeks) + '<th></th></tr>';
      table.innerHTML = headerRow;

      for (const [group, subgroups] of Object.entries(structure)) {
        table.innerHTML += `<tr><td class="exercise-name group-level-1">${group}</td><td colspan="${weeks * 6 + 1}"></td></tr>`;
        for (const [subgroup, exercises] of Object.entries(subgroups)) {
          table.innerHTML += `<tr><td class="exercise-name group-level-2">${subgroup}</td><td colspan="${weeks * 6 + 1}"></td></tr>`;
          for (const ex of exercises) {
            let row = `<tr><td class="exercise-name group-level-3" onclick="showChart('${ex}')">${ex}</td>`;
            for (let w = 1; w <= weeks; w++) {
              const key1 = `${ex}-week${w}-1`;
              const key2 = `${ex}-week${w}-2`;
              const data1 = logs[key1] || { sets: '', reps: '', weight: '' };
              const data2 = logs[key2] || { sets: '', reps: '', weight: '' };
              row += `
                <td><input type='number' value='${data1.sets}' onchange="updateLog('${key1}', 'sets', this.value)"></td>
                <td><input type='number' value='${data1.reps}' onchange="updateLog('${key1}', 'reps', this.value)"></td>
                <td><input type='number' value='${data1.weight}' onchange="updateLog('${key1}', 'weight', this.value)"></td>
                <td><input type='number' value='${data2.sets}' onchange="updateLog('${key2}', 'sets', this.value)"></td>
                <td><input type='number' value='${data2.reps}' onchange="updateLog('${key2}', 'reps', this.value)"></td>
                <td><input type='number' value='${data2.weight}' onchange="updateLog('${key2}', 'weight', this.value)"></td>`;
            }
            row += '<td></td></tr>';
            table.innerHTML += row;
          }
        }
      }
      wrapper.appendChild(table);
      container.appendChild(wrapper);
    }

    function updateLog(key, field, value) {
      if (!logs[key]) logs[key] = {};
      logs[key][field] = value;
      saveLogs();
    }

    function addWeek() {
      weeks++;
      createTable();
    }

    function showChart(exercise) {
      const dataPoints = [];
      for (let w = 1; w <= weeks; w++) {
        const entry1 = logs[`${exercise}-week${w}-1`];
        const entry2 = logs[`${exercise}-week${w}-2`];
        if (entry1 && entry1.weight) {
          dataPoints.push({ x: (w - 1) * 2 + 1, y: parseFloat(entry1.weight) });
        }
        if (entry2 && entry2.weight) {
          dataPoints.push({ x: (w - 1) * 2 + 2, y: parseFloat(entry2.weight) });
        }
      }
      const ctx = document.getElementById('exerciseChart').getContext('2d');
      if (ctx.chart) ctx.chart.destroy();
      ctx.chart = new Chart(ctx, {
        type: 'line',
        data: {
          datasets: [{
            label: `${exercise} - Weight Progression`,
            data: dataPoints,
            borderColor: '#4a90e2',
            backgroundColor: 'rgba(74, 144, 226, 0.1)',
            borderWidth: 2,
            tension: 0.3
          }]
        },
        options: {
          scales: {
            x: { title: { display: true, text: 'Session #' }, ticks: { stepSize: 1 } },
            y: { title: { display: true, text: 'Weight (lbs)' }, beginAtZero: true }
          }
        }
      });
      document.getElementById('chartModal').style.display = 'flex';
    }

    function closeChart() {
      document.getElementById('chartModal').style.display = 'none';
    }

    window.onload = () => loadLogs();
  </script>

  <h1>Log</h1>
  <div id="tableContainer"></div>
  <div id="chartModal" onclick="closeChart()">
    <div id="chartBox">
      <canvas id="exerciseChart"></canvas>
    </div>
  </div>
</body>
</html>
