<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logbook</title>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>
  <style>
    :root {
      --bg: #121212;
      --text: #e0e0e0;
      --accent: #4a90e2;
      --card-bg: #1e1e1e;
      --border: #333;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', sans-serif;
      padding: 1rem;
      margin: 0;
    }
    h1 {
      text-align: center;
      color: var(--accent);
    }
    .tabs {
      display: flex;
      justify-content: center;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }
    .tab-button {
      margin: 0.3rem;
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 5px;
      background-color: var(--card-bg);
      color: var(--text);
      cursor: pointer;
    }
    .tab-button.active {
      background-color: var(--accent);
      color: white;
    }
    .exercise-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      margin: 0.5rem 0;
      padding: 0.5rem 1rem;
      border-radius: 6px;
    }
    .group-level-1 {
      font-weight: bold;
      font-size: 1.2em;
      margin-top: 1rem;
    }
    .group-level-2 {
      font-style: italic;
      margin-left: 1rem;
    }
    .group-level-3 {
      margin-left: 2rem;
    }
    .input-row {
      display: flex;
      gap: 1rem;
      margin-top: 0.5rem;
    }
    .input-row input {
      background: #2a2a2a;
      color: white;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.3rem 0.5rem;
      width: 4rem;
    }
  </style>
</head>
<body>
  <script>
    if (prompt("Enter access code:") !== "80085") {
      document.body.innerHTML = "<h1 style='color:red;text-align:center'>Access Denied</h1>";
      throw new Error("Access Denied");
    }

    const firebaseConfig = {
      apiKey: "AIzaSyCLxAt4SkpTVsL1sWa3Ed-Z6e7XpMznMmA",
      authDomain: "tracker-d4c4b.firebaseapp.com",
      projectId: "tracker-d4c4b",
      storageBucket: "tracker-d4c4b.firebasestorage.app",
      messagingSenderId: "907184545564",
      appId: "1:907184545564:web:5bf3998dfe986aa1a264d9"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const userId = "log_user_8008";
    let logs = {};
    let currentTab = 'Push';

    const structure = {
      Push: {
        Chest: ["Dips (Optional) - [3x6-10]", "Bench Press - [4x5-8]", "Incline Press - [3x6-10]"],
        Shoulder: ["Overhead Press (Machine) - [3x6-10]", "Lateral Raises (Cable) - [3x10-15]"],
        Triceps: ["Triceps Pushdown - [3x10-12]", "Overhead Cable Triceps Extension (Bar) [1] - [3x10-12]", "Skull Crushers [2] - [3x8-10]"]
      },
      Pull: {
        Back: ["Pullups (Optional) - [3x6-10]", "Deadlift - [4x5]", "Lat Pulldowns (Neutral Grip) - [3x8-12]", "Chest Supported Row [1] - [3x6-10]", "Cable Row [2] - [3x8-12]", "Face Pull - [3x12-15]"],
        Biceps: ["Face Away Bayesian Curl (Optionial) - [3x10-12]", "Preacher Dumbbell Curl - [3x8-10]", "Preacher Hammer Curl - [3x8-10]"]
      },
      Legs: {
        Quads: ["Barbell Back Squat - [4x5-8]", "Bulgarian Split Squat - [2x8-10]"],
        Hamstrings: ["Romanian Deadlifts - [3-4x6-10]"],
        Glutes: ["Walking Lunges - [3x8-12]", "Hip Abduction - [3x12-15]"],
        Calves: ["Standing Calf Raise - [4x10-15]"]
      }
    };

    async function loadLogs() {
      const doc = await db.collection("logs").doc(userId).get();
      if (doc.exists) logs = doc.data();
      renderTab();
    }

    function saveLogs() {
      db.collection("logs").doc(userId).set(logs);
    }

    function renderTab() {
      const container = document.getElementById('tableContainer');
      container.innerHTML = '';
      for (const [subgroup, exercises] of Object.entries(structure[currentTab])) {
        const header1 = document.createElement('div');
        header1.className = 'group-level-2';
        header1.textContent = subgroup;
        container.appendChild(header1);
        for (const ex of exercises) {
          const card = document.createElement('div');
          card.className = 'exercise-card group-level-3';
          const label = document.createElement('div');
          label.textContent = ex;
          const reps = document.createElement('input');
          reps.type = 'number';
          reps.placeholder = 'Reps';
          reps.value = logs[`${ex}-reps`] || '';
          reps.onchange = () => updateLog(`${ex}-reps`, reps.value);
          const weight = document.createElement('input');
          weight.type = 'number';
          weight.placeholder = 'Weight';
          weight.value = logs[`${ex}-weight`] || '';
          weight.onchange = () => updateLog(`${ex}-weight`, weight.value);
          const inputRow = document.createElement('div');
          inputRow.className = 'input-row';
          inputRow.append(reps, weight);
          card.append(label, inputRow);
          container.appendChild(card);
        }
      }
    }

    function updateLog(key, value) {
      logs[key] = value;
      saveLogs();
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`tab-${tab}`).classList.add('active');
      renderTab();
    }

    window.onload = () => loadLogs();
  </script>

  <h1>Workout Log</h1>
  <div class="tabs">
    <button class="tab-button active" id="tab-Push" onclick="switchTab('Push')">Push</button>
    <button class="tab-button" id="tab-Pull" onclick="switchTab('Pull')">Pull</button>
    <button class="tab-button" id="tab-Legs" onclick="switchTab('Legs')">Legs</button>
  </div>
  <div id="tableContainer"></div>
</body>
</html>
