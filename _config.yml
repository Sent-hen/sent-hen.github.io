title: Senthen Velmurugan
description: "Senthen Velmurugan: consumption and creation."
author: Senthen Velmurugan
url: "https://sent-hen.github.io"
baseurl: ""

markdown: kramdown
permalink: pretty

collections:
  consumption:       # one file per item in _consumption/<category>/; the folder is the category, the body is the note
    output: true
    permalink: /consumption/:path/
  projects:          # writeups for completed projects; entries live in _data/projects.yml
    output: true
    permalink: /projects/:path/

defaults:
  - scope:
      path: ""
      type: "consumption"
    values:
      layout: "item"
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"
  - scope:
      path: ""
    values:
      layout: "default"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
