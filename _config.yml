title: Senthen Velmurugan
description: "Senthen Velmurugan: input, stuff, and output."
author: Senthen Velmurugan
url: "https://sent-hen.github.io"
baseurl: ""

markdown: kramdown
plugins:
  - jekyll-redirect-from   # old /projects/ links forward to /experiments/ and /notes/
permalink: pretty

collections:
  input:             # one file per item in _input/<category>/; the folder is the category, the body is the note
    output: true
    permalink: /input/:path/
  notes:             # one note per file in _notes/; each is about an experiment in _data/experiments.yml
    output: true
    permalink: /notes/:path/

defaults:
  - scope:
      path: ""
      type: "input"
    values:
      layout: "item"
  - scope:
      path: ""
      type: "notes"
    values:
      layout: "note"
  - scope:
      path: ""
    values:
      layout: "default"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - vendor
