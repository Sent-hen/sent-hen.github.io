title: Senthen Velmurugan
description: "Senthen Velmurugan: output."
author: Senthen Velmurugan
url: "https://sent-hen.github.io"
baseurl: ""

markdown: kramdown
plugins:
  - jekyll-redirect-from   # old /projects/ links forward to /experiments/ and /notes/
permalink: pretty

collections:
  input:             # one file per item in _input/<category>/; kept in the repo but not published (output: true to bring back)
    output: false
    permalink: /input/:path/
  notes:             # one note per file in _notes/; each is about an experiment in _data/experiments.yml
    output: true
    permalink: /notes/:path/

defaults:
  - scope:
      path: ""
      type: "input"
    values:
      layout: "item"
  - scope:
      path: ""
      type: "notes"
    values:
      layout: "note"
  - scope:
      path: ""
    values:
      layout: "default"

exclude:
  # Input is not published; the files stay so it can come back. Stuff reads the input items directly.
  - input.html
  - input
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - vendor
