title: Senthen Velmurugan
description: "Senthen Velmurugan: projects and experience."
author: Senthen Velmurugan
url: "https://sent-hen.github.io"   # update to your GitHub Pages URL
baseurl: ""                          # e.g. "/your-repo-name" if not a user/org page

markdown: kramdown

collections:
  projects:          # writeups for completed projects; entries live in _data/projects.yml
    output: true
    permalink: /projects/:path/

defaults:
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"
  - scope:
      path: ""
    values:
      layout: "default"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
